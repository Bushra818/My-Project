version: "3.8"
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: worldchaos
      POSTGRES_PASSWORD: worldchaos
      POSTGRES_DB: worldchaos
    ports:
      - "5432:5432"
    volumes:
      - worldchaos_data:/var/lib/postgresql/data

volumes:
  worldchaos_data:
