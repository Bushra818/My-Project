services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: worldchaos
      MYSQL_USER: worldchaos
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    ports:
      - "3306:3306"
    volumes:
      - worldchaos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "worldchaos", "--password=${DB_PASSWORD:-change-this-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  worldchaos_mysql_data:
